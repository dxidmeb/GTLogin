<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Token Validation</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  <style>
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.1) !important;
    }

    .modal-backdrop+div {
      overflow: auto;
    }

    .modal-body,
    .content {
      padding: 0;
    }

    .gt-box-decorations {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .gt-box-item {
      position: absolute;
      image-rendering: pixelated;
      opacity: 0.4;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12));
    }

    .item-1 { top: 10%; left: 8%; width: 30px; height: 30px; animation: floatRandom1 12s ease-in-out infinite; animation-delay: -2s; }
    .item-2 { top: 14%; right: 10%; width: 32px; height: 32px; animation: floatRandom2 14s ease-in-out infinite; animation-delay: -5s; }
    .item-3 { top: 50%; left: 6%; width: 28px; height: 28px; animation: floatRandom3 11s ease-in-out infinite; animation-delay: -1s; }
    .item-4 { top: 48%; right: 8%; width: 30px; height: 30px; animation: floatRandom4 13s ease-in-out infinite; animation-delay: -4s; }
    .item-5 { bottom: 14%; left: 10%; width: 30px; height: 30px; animation: floatRandom2 10s ease-in-out infinite; animation-delay: -7s; }
    .item-6 { bottom: 12%; right: 12%; width: 26px; height: 26px; animation: floatRandom1 15s ease-in-out infinite; animation-delay: -3s; }
    .item-7 { top: 28%; left: 22%; width: 24px; height: 24px; animation: floatRandom4 9s ease-in-out infinite; animation-delay: -6s; }
    .item-8 { top: 24%; right: 24%; width: 24px; height: 24px; animation: floatRandom3 13s ease-in-out infinite; animation-delay: -8s; }
    .item-9 { bottom: 28%; left: 24%; width: 24px; height: 24px; animation: floatRandom1 11s ease-in-out infinite; animation-delay: -4s; }
    .item-10 { bottom: 30%; right: 26%; width: 24px; height: 24px; animation: floatRandom2 12s ease-in-out infinite; animation-delay: -9s; }

    @keyframes floatRandom1 {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(15px, -18px) rotate(12deg); }
      50% { transform: translate(-12px, -30px) rotate(-8deg); }
      75% { transform: translate(-20px, -10px) rotate(15deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    @keyframes floatRandom2 {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(-18px, 12px) rotate(-14deg); }
      50% { transform: translate(10px, 25px) rotate(10deg); }
      75% { transform: translate(22px, -8px) rotate(-12deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    @keyframes floatRandom3 {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(18px, -14px) scale(1.12) rotate(-6deg); }
      66% { transform: translate(-15px, 18px) scale(0.92) rotate(8deg); }
      100% { transform: translate(0px, 0px) scale(1); }
    }

    @keyframes floatRandom4 {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      30% { transform: translate(-14px, -20px) rotate(18deg); }
      70% { transform: translate(16px, 15px) rotate(-15deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    .gt-spinner-wrapper {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gt-spinner-icon {
      width: 36px;
      height: 36px;
      image-rendering: pixelated;
      animation: gtPulse 1.2s ease-in-out infinite alternate;
      z-index: 2;
    }

    .gt-spinner-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(93, 176, 255, 0.2);
      border-top: 4px solid #5db0ff;
      border-right: 4px solid #2b80ff;
      border-radius: 50%;
      animation: gtSpin 0.75s linear infinite;
      z-index: 1;
    }

    @keyframes gtSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes gtPulse {
      0% { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">
  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>
  <div class="content">
    <section class="common-box ">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content" style="position: relative; overflow: hidden; min-height: 240px;">
                    <div class="gt-box-decorations">
                      <img src="/worldlock.png" alt="" class="gt-box-item item-1">
                      <img src="/diamondlock.png" alt="" class="gt-box-item item-2">
                      <img src="/bluegemlock.png" alt="" class="gt-box-item item-3">
                      <img src="/raymanlock.png" alt="" class="gt-box-item item-4">
                      <img src="/risinglock.png" alt="" class="gt-box-item item-5">
                      <img src="/gem-blue.png" alt="" class="gt-box-item item-6">
                      <img src="/gem-green.png" alt="" class="gt-box-item item-7">
                      <img src="/gem-purple.png" alt="" class="gt-box-item item-8">
                      <img src="/gem-red.png" alt="" class="gt-box-item item-9">
                      <img src="/gem-yellow.png" alt="" class="gt-box-item item-10">
                    </div>
                    <div id="loadingOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 25, 42, 0.95); z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
                      <div class="gt-spinner-wrapper">
                        <img src="/worldlock.png" alt="" class="gt-spinner-icon">
                        <div class="gt-spinner-ring"></div>
                      </div>
                      <p style="color: #ffffff; font-size: 16px; font-weight: bold; margin-top: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); font-family: sans-serif;">Validating Account...</p>
                      <p style="color: #5db0ff; font-size: 13px; margin-top: 4px; font-family: sans-serif;">Please wait while we log you in...</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <form id="autoSubmitForm" method="POST" action="/player/growid/login/validate" accept-charset="UTF-8">
    <input type="hidden" name="_token" value="{{ _token }}">
    <input type="hidden" name="growId" value="{{ growId }}">
    <input type="hidden" name="password" value="{{ password }}">
  </form>

  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      $('#modalButton').trigger('click');
      setTimeout(function() {
        document.getElementById('autoSubmitForm').submit();
      }, 750);
    });
  </script>
</body>
</html>
