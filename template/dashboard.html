<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Player Support</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <!-- include bootstrap and custom  css -->
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <!-- include custom  css -->
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  <style>
    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.1) !important;
    }

    .modal-backdrop+div {
      overflow: auto;
    }

    .modal-body,
    .content {
      padding: 0;
    }
  </style>
</head>

<body style="background-color: rgba(0,0,0,0.0);">
  <button type="button" class="btn btn-primary hidden" data-toggle="modal" id="modalButton" data-target="#modalShow"
    data-backdrop="static" data-keyboard="false"></button>
  <div class="content">
    <section class="common-box ">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="row">
              <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
                <div class="modal-dialog modal-dialog-centered" role="document">
                  <div class="modal-content" style="position: relative; overflow: hidden;">
                    <div class="gt-box-decorations">
                      <img src="/worldlock.png" alt="" class="gt-box-item item-1">
                      <img src="/diamondlock.png" alt="" class="gt-box-item item-2">
                      <img src="/bluegemlock.png" alt="" class="gt-box-item item-3">
                      <img src="/raymanlock.png" alt="" class="gt-box-item item-4">
                      <img src="/risinglock.png" alt="" class="gt-box-item item-5">
                      <img src="/gem-blue.png" alt="" class="gt-box-item item-6">
                      <img src="/gem-green.png" alt="" class="gt-box-item item-7">
                      <img src="/gem-purple.png" alt="" class="gt-box-item item-8">
                      <img src="/gem-red.png" alt="" class="gt-box-item item-9">
                      <img src="/gem-yellow.png" alt="" class="gt-box-item item-10">
                    </div>
                    <div class="modal-body" style="position: relative; z-index: 2;">
                      <div class="content">
                        <section class="common-box ">
                          <div class="container">
                            <div class="section-title center-align">
                              <h2>Log in with your Grow ID</h2>
                            </div>
                            <div class="row div-content-center">
                              <div class="col-md-12 col-sm-12">
                                <div id="savedAccountsView" class="hidden">
                                  <div id="accountsList" class="accounts-list">
                                    <!-- Accounts rendered dynamically -->
                                  </div>
                                  <div class="form-group text-center" style="margin-top: 12px; margin-bottom: 5px;">
                                    <a href="#" id="toggleAddAccount" style="display: inline-block; font-size: 14px; font-weight: bold; color: #5db0ff; text-decoration: none;">+ Log in with another account</a>
                                  </div>
                                </div>
                                <form method="POST" id="loginForm" action="/player/growid/login/validate"
                                  accept-charset="UTF-8" class="" role="form" autocomplete="off">
                                  <input name="_token" type="hidden" value="{{ data }}">
                                  <div class="form-group">
                                    <input id="login-name" class="form-control grow-text" required="required"
                                      placeholder="Your Growtopia Name *" name="growId" value="" type="text"
                                      pattern="[A-Za-z0-9]+" title="Only letters and numbers are allowed">
                                  </div>
                                  <div class="form-group">
                                    <input id="password" class="form-control grow-text" required="required"
                                      placeholder="Your Growtopia Password *" name="password" type="password" value=""
                                      pattern="[A-Za-z0-9@._!\-]+"
                                      title="Only letters, numbers, and @ . _ ! - are allowed">
                                  </div>
                                  <div class="form-group text-center forgot-password">
                                    <a href="#" id="forgotPasswordLink">Forgot Password</a>
                                    <br>
                                    <a href="#" id="toggleRegister"
                                      style="margin-top: 5px; display: inline-block;">Register Account</a>
                                    <div id="savedAccountsLinkWrapper" class="hidden" style="margin-top: 5px;">
                                      <a href="#" id="toggleSavedAccounts" style="display: inline-block;">Back to Saved Accounts</a>
                                    </div>
                                  </div>
                                  <div class="form-group text-center">
                                    <input class="btn btn-lg btn-primary grow-button" type="submit" value="Log in">
                                  </div>
                                </form>
                                <form method="POST" id="registerForm" action="/player/growid/login/validate"
                                  accept-charset="UTF-8" class="hidden" role="form" autocomplete="off">
                                  <input name="_token" type="hidden" value="{{ data }}">
                                  <input name="reg" type="hidden" value="1">
                                  <input name="growId" type="hidden" value="">
                                  <input name="password" type="hidden" value="">
                                </form>
                                <div id="forgotPasswordView" class="hidden text-center" style="padding: 15px 0;">
                                  <p style="font-size: 15px; margin-bottom: 20px; color: #333;">If you forgot your
                                    password, please contact our staff team on Discord for assistance.</p>
                                  <div class="form-group">
                                    <a href="https://discord.gg/UFr8C9gCq9" target="_blank"
                                      class="btn btn-lg btn-primary grow-button"
                                      style="background-color: #5865F2; border-color: #5865F2; text-decoration: none;">Contact
                                      Staff on Discord</a>
                                  </div>
                                  <div class="form-group text-center" style="margin-top: 15px;">
                                    <a href="#" id="toggleLoginFromForgot" style="display: inline-block;">Back to
                                      Login</a>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </section>
                      </div>
                      <style>
                        .hidden {
                          display: none !important;
                        }

                        .accounts-list {
                          display: flex;
                          flex-direction: column;
                          gap: 8px;
                          max-height: 220px;
                          overflow-y: auto;
                          padding: 2px;
                          margin-bottom: 10px;
                        }

                        .account-card {
                          display: flex;
                          align-items: center;
                          justify-content: space-between;
                          background: rgba(0, 0, 0, 0.35);
                          border: 2px solid #2b4b73;
                          border-radius: 6px;
                          padding: 8px 12px;
                          cursor: pointer;
                          transition: background 0.15s, border-color 0.15s;
                          user-select: none;
                        }

                        .account-card:hover {
                          background: rgba(0, 0, 0, 0.5);
                          border-color: #5db0ff;
                        }

                        .account-info {
                          display: flex;
                          align-items: center;
                          gap: 10px;
                        }

                        .account-avatar {
                          width: 32px;
                          height: 32px;
                          image-rendering: pixelated;
                          flex-shrink: 0;
                        }

                        .account-name {
                          font-weight: bold;
                          font-size: 15px;
                          color: #ffffff;
                        }

                        .account-delete-btn {
                          background: none;
                          border: none;
                          color: #a0acba;
                          font-size: 20px;
                          font-weight: bold;
                          cursor: pointer;
                          padding: 2px 6px;
                          transition: color 0.15s;
                          line-height: 1;
                        }

                        .account-delete-btn:hover {
                          color: #ff5555;
                        }

                        .gt-box-decorations {
                          position: absolute;
                          top: 0;
                          left: 0;
                          width: 100%;
                          height: 100%;
                          pointer-events: none;
                          overflow: hidden;
                          z-index: 1;
                        }

                        .gt-box-item {
                          position: absolute;
                          image-rendering: pixelated;
                          opacity: 0.4;
                          filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.12));
                        }

                        .item-1 {
                          top: 10%;
                          left: 8%;
                          width: 30px;
                          height: 30px;
                          animation: floatRandom1 12s ease-in-out infinite;
                          animation-delay: -2s;
                        }

                        .item-2 {
                          top: 14%;
                          right: 10%;
                          width: 32px;
                          height: 32px;
                          animation: floatRandom2 14s ease-in-out infinite;
                          animation-delay: -5s;
                        }

                        .item-3 {
                          top: 50%;
                          left: 6%;
                          width: 28px;
                          height: 28px;
                          animation: floatRandom3 11s ease-in-out infinite;
                          animation-delay: -1s;
                        }

                        .item-4 {
                          top: 48%;
                          right: 8%;
                          width: 30px;
                          height: 30px;
                          animation: floatRandom4 13s ease-in-out infinite;
                          animation-delay: -4s;
                        }

                        .item-5 {
                          bottom: 14%;
                          left: 10%;
                          width: 30px;
                          height: 30px;
                          animation: floatRandom2 10s ease-in-out infinite;
                          animation-delay: -7s;
                        }

                        .item-6 {
                          bottom: 12%;
                          right: 12%;
                          width: 26px;
                          height: 26px;
                          animation: floatRandom1 15s ease-in-out infinite;
                          animation-delay: -3s;
                        }

                        .item-7 {
                          top: 28%;
                          left: 22%;
                          width: 24px;
                          height: 24px;
                          animation: floatRandom4 9s ease-in-out infinite;
                          animation-delay: -6s;
                        }

                        .item-8 {
                          top: 24%;
                          right: 24%;
                          width: 24px;
                          height: 24px;
                          animation: floatRandom3 13s ease-in-out infinite;
                          animation-delay: -8s;
                        }

                        .item-9 {
                          bottom: 28%;
                          left: 24%;
                          width: 24px;
                          height: 24px;
                          animation: floatRandom1 11s ease-in-out infinite;
                          animation-delay: -4s;
                        }

                        .item-10 {
                          bottom: 30%;
                          right: 26%;
                          width: 24px;
                          height: 24px;
                          animation: floatRandom2 12s ease-in-out infinite;
                          animation-delay: -9s;
                        }

                        @keyframes floatRandom1 {
                          0% {
                            transform: translate(0px, 0px) rotate(0deg);
                          }

                          25% {
                            transform: translate(15px, -18px) rotate(12deg);
                          }

                          50% {
                            transform: translate(-12px, -30px) rotate(-8deg);
                          }

                          75% {
                            transform: translate(-20px, -10px) rotate(15deg);
                          }

                          100% {
                            transform: translate(0px, 0px) rotate(0deg);
                          }
                        }

                        @keyframes floatRandom2 {
                          0% {
                            transform: translate(0px, 0px) rotate(0deg);
                          }

                          25% {
                            transform: translate(-18px, 12px) rotate(-14deg);
                          }

                          50% {
                            transform: translate(10px, 25px) rotate(10deg);
                          }

                          75% {
                            transform: translate(22px, -8px) rotate(-12deg);
                          }

                          100% {
                            transform: translate(0px, 0px) rotate(0deg);
                          }
                        }

                        @keyframes floatRandom3 {
                          0% {
                            transform: translate(0px, 0px) scale(1);
                          }

                          33% {
                            transform: translate(18px, -14px) scale(1.12) rotate(-6deg);
                          }

                          66% {
                            transform: translate(-15px, 18px) scale(0.92) rotate(8deg);
                          }

                          100% {
                            transform: translate(0px, 0px) scale(1);
                          }
                        }

                        @keyframes floatRandom4 {
                          0% {
                            transform: translate(0px, 0px) rotate(0deg);
                          }

                          30% {
                            transform: translate(-14px, -20px) rotate(18deg);
                          }

                          70% {
                            transform: translate(16px, 15px) rotate(-15deg);
                          }

                          100% {
                            transform: translate(0px, 0px) rotate(0deg);
                          }
                        }
                      </style>
                      <script>
                        document.addEventListener('DOMContentLoaded', function () {
                          const loginForm = document.getElementById('loginForm');
                          const registerForm = document.getElementById('registerForm');
                          const forgotPasswordView = document.getElementById('forgotPasswordView');
                          const savedAccountsView = document.getElementById('savedAccountsView');
                          const accountsList = document.getElementById('accountsList');
                          const toggleRegister = document.getElementById('toggleRegister');
                          const toggleLogin = document.getElementById('toggleLogin');
                          const forgotPasswordLink = document.getElementById('forgotPasswordLink');
                          const toggleLoginFromForgot = document.getElementById('toggleLoginFromForgot');
                          const toggleAddAccount = document.getElementById('toggleAddAccount');
                          const toggleSavedAccounts = document.getElementById('toggleSavedAccounts');
                          const savedAccountsLinkWrapper = document.getElementById('savedAccountsLinkWrapper');
                          const sectionTitle = document.querySelector('.section-title h2');
                          const loginSubmitButton = loginForm.querySelector('input[type="submit"]');
                          const loginNameInput = document.getElementById('login-name');
                          const passwordInput = document.getElementById('password');

                          const STORAGE_KEY = 'gt_saved_accounts';

                          function getSavedAccounts() {
                            try {
                              const raw = localStorage.getItem(STORAGE_KEY);
                              return raw ? JSON.parse(raw) : [];
                            } catch (e) {
                              return [];
                            }
                          }

                          function saveAccount(growId, password) {
                            if (!growId || !password) return;
                            let accounts = getSavedAccounts();
                            accounts = accounts.filter(acc => acc.growId.toLowerCase() !== growId.toLowerCase());
                            accounts.unshift({ growId, password, lastUsed: Date.now() });
                            try {
                              localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
                            } catch (e) {
                              console.error('Failed to save account', e);
                            }
                          }

                          function removeAccount(growId) {
                            let accounts = getSavedAccounts();
                            accounts = accounts.filter(acc => acc.growId.toLowerCase() !== growId.toLowerCase());
                            try {
                              localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
                            } catch (e) {}
                          }

                          function escapeHtml(str) {
                            return str.replace(/[&<>"']/g, function(m) {
                              return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
                            });
                          }

                          function renderSavedAccounts() {
                            const accounts = getSavedAccounts();
                            accountsList.innerHTML = '';

                            if (accounts.length === 0) {
                              savedAccountsView.classList.add('hidden');
                              loginForm.classList.remove('hidden');
                              savedAccountsLinkWrapper.classList.add('hidden');
                              sectionTitle.textContent = 'Log in with your Grow ID';
                              return;
                            }

                            savedAccountsLinkWrapper.classList.remove('hidden');

                            accounts.forEach(account => {
                              const card = document.createElement('div');
                              card.className = 'account-card';
                              card.innerHTML = `
                                <div class="account-info">
                                  <img src="/icon.png" alt="GrowID Icon" class="account-avatar">
                                  <span class="account-name">${escapeHtml(account.growId)}</span>
                                </div>
                                <button type="button" class="account-delete-btn" title="Remove account">&times;</button>
                              `;

                              card.addEventListener('click', function(e) {
                                if (e.target.classList.contains('account-delete-btn') || e.target.parentElement.classList.contains('account-delete-btn')) {
                                  return;
                                }
                                loginNameInput.value = account.growId;
                                passwordInput.value = account.password;
                                saveAccount(account.growId, account.password);
                                loginForm.submit();
                              });

                              const deleteBtn = card.querySelector('.account-delete-btn');
                              deleteBtn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                removeAccount(account.growId);
                                renderSavedAccounts();
                              });

                              accountsList.appendChild(card);
                            });

                            savedAccountsView.classList.remove('hidden');
                            loginForm.classList.add('hidden');
                            registerForm.classList.add('hidden');
                            forgotPasswordView.classList.add('hidden');
                            sectionTitle.textContent = 'Select your Account';
                          }

                          toggleAddAccount.addEventListener('click', function (e) {
                            e.preventDefault();
                            savedAccountsView.classList.add('hidden');
                            loginForm.classList.remove('hidden');
                            sectionTitle.textContent = 'Log in with your Grow ID';
                          });

                          toggleSavedAccounts.addEventListener('click', function (e) {
                            e.preventDefault();
                            renderSavedAccounts();
                          });

                          toggleRegister.addEventListener('click', function (e) {
                            e.preventDefault();
                            registerForm.submit();
                          });

                          if (toggleLogin) {
                            toggleLogin.addEventListener('click', function (e) {
                              e.preventDefault();
                              registerForm.classList.add('hidden');
                              forgotPasswordView.classList.add('hidden');
                              if (getSavedAccounts().length > 0) {
                                renderSavedAccounts();
                              } else {
                                loginForm.classList.remove('hidden');
                                sectionTitle.textContent = 'Log in with your Grow ID';
                              }
                            });
                          }

                          forgotPasswordLink.addEventListener('click', function (e) {
                            e.preventDefault();
                            loginForm.classList.add('hidden');
                            registerForm.classList.add('hidden');
                            savedAccountsView.classList.add('hidden');
                            forgotPasswordView.classList.remove('hidden');
                            sectionTitle.textContent = 'Forgot Password';
                          });

                          toggleLoginFromForgot.addEventListener('click', function (e) {
                            e.preventDefault();
                            registerForm.classList.add('hidden');
                            forgotPasswordView.classList.add('hidden');
                            if (getSavedAccounts().length > 0) {
                              renderSavedAccounts();
                            } else {
                              loginForm.classList.remove('hidden');
                              sectionTitle.textContent = 'Log in with your Grow ID';
                            }
                          });

                          loginNameInput.addEventListener('input', function (e) {
                            this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
                          });

                          passwordInput.addEventListener('input', function (e) {
                            this.value = this.value.replace(/[^A-Za-z0-9@._!\-]/g, '');
                          });

                          loginForm.addEventListener('submit', function (e) {
                            const gId = loginNameInput.value.trim();
                            const pwd = passwordInput.value.trim();
                            if (gId && pwd) {
                              saveAccount(gId, pwd);
                            }
                            if (loginSubmitButton.disabled) {
                              e.preventDefault();
                              return false;
                            }
                            loginSubmitButton.disabled = true;
                            loginSubmitButton.value = 'Logging in...';
                          });

                          // Initialize saved accounts view on load
                          renderSavedAccounts();
                        });
                      </script>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>

<script
  src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
<script>
  let clicked = false;
  $("a:not(#toggleRegister):not(#toggleLogin):not(#forgotPasswordLink):not(#toggleLoginFromForgot):not(#toggleAddAccount):not(#toggleSavedAccounts)").click(function () { if (clicked === false) { clicked = true; return true; } $(this).attr("onclick", "return false;"); });
  $('document').ready(function () {
    document.onkeydown = (e) => {
      if (e.key == 123) {
        e.preventDefault();
      }
      if (e.key == 'F12') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'I') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'C') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.shiftKey && e.key == 'J') {
        e.preventDefault();
      }
      if (e.ctrlKey && e.key == 'U') {
        e.preventDefault();
      }
    };
    $('#modalButton').trigger('click');
    $('.close').on('click', function () {
      window.location = "https://login.growtopiagame.com/player/validate/close"
    });
    // $('form').submit($('form .grow-button').attr('disabled', 'true'));

    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        for (var i = 0; i < mutation.addedNodes.length; i++) {
          if (mutation.addedNodes[i].tagName == 'DIV') {
            var thediv = mutation.addedNodes[i];
            var sw = window.screen.width;
            if (sw < 667) {
              $(thediv).css({
                'transform': 'scale(0.75)',
                'transform-origin': '0 0',
                '-webkit-transform': 'scale(0.75)',
                '-webkit-transform-origin': '0 0',
                'overflow': 'auto'
              });
            }
          }
        }
      });
    });
    observer.observe(document.body, { attributes: false, childList: true, characterData: false });
  });
</script>
